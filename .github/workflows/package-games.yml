name: Package game variants

on:
  push:
    paths:
      - '.package-src/**'
      - '.github/workflows/package-games.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build independent ZIP files
        run: |
          mkdir -p dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path(".package-src")
          for folder, archive in (("受験戦争", "jukenwar.zip"), ("企業戦略", "conpany.zip")):
              with ZipFile(Path("dist") / archive, "w", ZIP_DEFLATED, compresslevel=9) as z:
                  for f in sorted((root / folder).rglob("*")):
                      if f.is_file():
                          z.write(f, f.relative_to(root / folder).as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jukenwar
          path: dist/jukenwar.zip
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: conpany
          path: dist/conpany.zip
          retention-days: 90
