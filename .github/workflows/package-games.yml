name: Package game variants

on:
  push:
    paths:
      - '.package-src/**'
      - '.github/workflows/package-games.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build separate ZIP
        run: |
          mkdir -p dist
          cd .package-src
          zip -qr ../dist/knotspace-games.zip README.md 受験戦争 企業戦略
      - uses: actions/upload-artifact@v4
        with:
          name: knotspace-games-zip
          path: dist/knotspace-games.zip
          retention-days: 30
