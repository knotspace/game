<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10151d"><meta name="description" content="会社を設立し、商品開発・採用・投資を通じて企業を成長させる経営シミュレーション。">
<title>企業戦略｜経営シミュレーション</title>
<style>
:root{color-scheme:dark;--bg:#10151d;--panel:#192230;--panel2:#202c3c;--line:#344357;--text:#edf3fa;--muted:#9eacbd;--accent:#8db8a0;--gold:#e5c27a;--red:#e38d86}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#263a4a,transparent 55%),var(--bg);color:var(--text);font:15px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(980px,100%);margin:auto;padding:24px 16px 70px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--accent)}h1{font-size:clamp(28px,6vw,44px);line-height:1.15;margin:4px 0}.sub{color:var(--muted);margin:0}.panel{background:linear-gradient(145deg,var(--panel),#151d28);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--panel2);border-radius:12px;padding:12px;min-width:0}.stat small{display:block;color:var(--muted)}.stat b{font-size:clamp(18px,3vw,25px);font-variant-numeric:tabular-nums}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.action{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:13px;border-radius:12px;text-align:left;cursor:pointer;font:inherit}.action:hover{border-color:var(--accent);transform:translateY(-1px)}.action b{display:block}.action small{color:var(--muted)}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--accent);color:#102018;border:0;border-radius:10px;padding:11px 17px;font-weight:800;cursor:pointer}.quiet{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.log{display:grid;gap:7px;max-height:260px;overflow:auto}.entry{padding:8px 10px;border-left:2px solid var(--line);background:#ffffff06;color:#c8d3df;font-size:13px}.entry.good{border-color:var(--accent)}.entry.bad{border-color:var(--red)}.bar{height:7px;border-radius:9px;background:#0e141c;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--accent)}.tag{font-size:11px;color:var(--gold);letter-spacing:.12em}.notice{color:var(--muted);font-size:12px}.hidden{display:none!important}@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}main{padding:18px 12px 50px}.panel{padding:15px}}
</style></head>
<body><main>
<header class="head"><div><div class="eyebrow">BUSINESS SIMULATION</div><h1>企業戦略</h1><p class="sub">小さな会社から、業界を動かす企業へ。</p></div><button class="quiet" id="reset">最初から</button></header>
<section id="setup" class="panel"><div class="tag">FOUNDATION</div><h2>会社を設立する</h2><p class="sub">社名と事業分野を決めて、最初の一歩を踏み出そう。</p><p><label>会社名<br><input id="company" maxlength="20" value="青空テクノロジー" style="width:100%;padding:11px;border-radius:9px;background:#101821;color:var(--text);border:1px solid var(--line);font:inherit"></label></p><div class="actions" id="sectors"><button class="action" data-sector="tech"><b>IT・テクノロジー</b><small>成長性が高い。研究開発に強い</small></button><button class="action" data-sector="food"><b>食品・小売</b><small>安定した需要。店舗展開が得意</small></button><button class="action" data-sector="maker"><b>製造・メーカー</b><small>設備投資で生産力を伸ばす</small></button><button class="action" data-sector="service"><b>サービス</b><small>人材と顧客満足が重要</small></button></div><p><button class="primary" id="start">この会社で始める</button></p></section>
<section id="game" class="hidden">
<div class="panel row"><div><div class="tag">FISCAL YEAR <span id="year">1</span></div><h2 id="companyName">会社</h2><div class="notice" id="sectorName"></div></div><button class="primary" id="closeYear">年度を締める →</button></div>
<div class="stats">
<div class="stat"><small>現金</small><b id="cash">¥0</b></div><div class="stat"><small>年間売上</small><b id="revenue">¥0</b></div><div class="stat"><small>企業価値</small><b id="value">¥0</b></div><div class="stat"><small>従業員</small><b id="staff">0人</b></div>
</div>
<div class="grid"><section class="panel"><div class="tag">MANAGEMENT</div><h3>経営アクション</h3><div class="actions">
<button class="action" data-act="product"><b>商品・サービス開発</b><small>費用をかけて競争力を上げる</small></button>
<button class="action" data-act="marketing"><b>広告・マーケティング</b><small>認知度を高め、売上を伸ばす</small></button>
<button class="action" data-act="hire"><b>人材採用</b><small>従業員を増やして事業を拡大</small></button>
<button class="action" data-act="training"><b>社員研修</b><small>生産性と品質を改善</small></button>
<button class="action" data-act="facility"><b>設備・店舗投資</b><small>生産能力を底上げ</small></button>
<button class="action" data-act="research"><b>研究開発</b><small>将来の成長力を育てる</small></button>
<button class="action" data-act="loan"><b>融資を受ける</b><small>現金を増やす。借入金も増える</small></button>
<button class="action" data-act="repay"><b>借入金を返済</b><small>財務を健全化する</small></button>
</div></section>
<section class="panel"><div class="tag">COMPANY PROFILE</div><h3>会社の状態</h3><p>ブランド力 <b id="brand">0</b></p><div class="bar"><i id="brandBar"></i></div><p>商品力 <b id="quality">0</b></p><div class="bar"><i id="qualityBar"></i></div><p>生産能力 <b id="capacity">0</b></p><div class="bar"><i id="capacityBar"></i></div><p>社員の生産性 <b id="productivity">0</b></p><div class="bar"><i id="productivityBar"></i></div><p>借入金 <b id="debt">¥0</b></p><p class="notice">各アクションは年度内に実行。年度末に売上・費用・利益が計算される。</p></section></div>
<section class="panel"><div class="row"><h3>経営日誌</h3><span class="notice">自動保存</span></div><div class="log" id="log"></div></section>
</section>
<section id="ending" class="panel hidden"><div class="tag">BUSINESS HISTORY</div><h2>会社の歴史</h2><p id="endingText"></p><button class="primary" id="restartEnd">もう一度経営する</button></section>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),fmt=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
const sectors={tech:{name:'IT・テクノロジー',cash:12000000,quality:38,brand:12,capacity:28,productivity:55,base:4500000,growth:1.18},food:{name:'食品・小売',cash:9000000,quality:45,brand:20,capacity:45,productivity:48,base:4200000,growth:1.08},maker:{name:'製造・メーカー',cash:16000000,quality:42,brand:10,capacity:58,productivity:45,base:4500000,growth:1.1},service:{name:'サービス',cash:8000000,quality:35,brand:25,capacity:30,productivity:62,base:3800000,growth:1.12}};
let chosen='tech',s=null;
const log=(msg,type='')=>{const d=document.createElement('div');d.className='entry '+type;d.textContent=msg;$('log').prepend(d)};
function save(){try{localStorage.setItem('knot-business-save',JSON.stringify(s))}catch(e){}}
function render(){if(!s)return;$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('ending').classList.add('hidden');$('year').textContent=s.year;$('companyName').textContent=s.name;$('sectorName').textContent=s.sectorName;$('cash').textContent=fmt(s.cash);$('revenue').textContent=fmt(s.revenue);$('value').textContent=fmt(s.value);$('staff').textContent=s.staff+'人';$('brand').textContent=s.brand;$('quality').textContent=s.quality;$('capacity').textContent=s.capacity;$('productivity').textContent=s.productivity;$('debt').textContent=fmt(s.debt);['brand','quality','capacity','productivity'].forEach(k=>$(k+'Bar').style.width=Math.min(100,s[k])+'%');save()}
function start(){const d=sectors[chosen];s={name:$('company').value.trim()||'新会社',sector:chosen,sectorName:d.name,year:1,cash:d.cash,revenue:0,profit:0,value:d.cash,staff:4,debt:0,brand:d.brand,quality:d.quality,capacity:d.capacity,productivity:d.productivity,base:d.base,growth:d.growth,actions:0};$('log').innerHTML='';log(s.name+'を設立。'+d.name+'で事業を開始した。','good');render()}
function act(a){if(!s)return;const costs={product:1800000,marketing:1000000,hire:1200000,training:650000,facility:2600000,research:2200000,loan:0,repay:0};let c=costs[a]||0;if(a==='loan'){s.cash+=5000000;s.debt+=5000000;log('銀行から500万円の融資を受けた。');render();return}if(a==='repay'){let p=Math.min(2000000,s.debt,s.cash);if(p<=0){log('返済できる借入金または現金がない。','bad');return}s.cash-=p;s.debt-=p;log(fmt(p)+'を返済した。','good');render();return}if(s.cash<c){log('現金が足りない。別の投資を検討しよう。','bad');return}s.cash-=c;s.actions++;const effects={product:['quality',9,'新商品を開発。商品力が向上した。'],marketing:['brand',10,'広告キャンペーンが成功。ブランド力が向上した。'],hire:['staff',3,'新たに3人を採用した。'],training:['productivity',9,'社員研修を実施。生産性が向上した。'],facility:['capacity',13,'設備・店舗を拡張。生産能力が向上した。'],research:['growth',.035,'研究開発が進み、将来の成長率が上がった。']};const [k,v,msg]=effects[a];s[k]+=v;log(msg,'good');render()}
function closeYear(){if(!s)return;const demand=s.base*Math.pow(s.growth,s.year-1);const capacityFactor=.65+s.capacity/100*.8;const qualityFactor=.75+s.quality/100*.5;const brandFactor=.8+s.brand/100*.4;const peopleFactor=.75+Math.min(1.2,s.staff*s.productivity/400)*.25;const sales=Math.round(demand*capacityFactor*qualityFactor*brandFactor*peopleFactor);const wages=s.staff*360000;const overhead=500000+s.capacity*7000;const interest=s.debt*.035;const expense=wages+overhead+interest;const profit=sales-expense;s.revenue=sales;s.profit=profit;s.cash+=profit;s.value=Math.max(0,Math.round(s.cash+s.capacity*130000+s.quality*90000+s.brand*65000-s.debt));log('第'+s.year+'期 売上 '+fmt(sales)+' ／ 経費 '+fmt(expense)+' ／ '+(profit>=0?'利益 ':'損失 ')+fmt(profit),profit>=0?'good':'bad');if(s.cash<0){$('game').classList.add('hidden');$('ending').classList.remove('hidden');$('endingText').textContent=s.name+'は資金繰りが続かず、'+s.year+'期で倒産した。企業価値：'+fmt(s.value);localStorage.removeItem('knot-business-save');return}if(s.year%5===0){const bonus=Math.round(s.brand*30000);s.cash+=bonus;log('節目の年。ブランド効果で追加収益 '+fmt(bonus)+' を獲得。','good')}s.year++;render()}
document.querySelectorAll('[data-sector]').forEach(b=>b.addEventListener('click',()=>{chosen=b.dataset.sector;document.querySelectorAll('[data-sector]').forEach(x=>x.style.borderColor=x===b?'var(--accent)':'var(--line)')}));
$('start').addEventListener('click',start);document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.act)));$('closeYear').addEventListener('click',closeYear);
$('reset').addEventListener('click',()=>{if(confirm('現在の会社データを消去して最初から始めますか？')){s=null;localStorage.removeItem('knot-business-save');$('game').classList.add('hidden');$('ending').classList.add('hidden');$('setup').classList.remove('hidden')}});
$('restartEnd').addEventListener('click',()=>{$('ending').classList.add('hidden');$('setup').classList.remove('hidden')});
try{const old=JSON.parse(localStorage.getItem('knot-business-save')||'null');if(old&&old.name&&old.year){s=old;render();log('前回の続きから再開しました。','good')}}catch(e){}
})();
</script></body></html>
