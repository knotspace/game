<!doctype html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Pacman</title>
  <script>
    window.google = {}
  </script>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
    body{font-family:Arial,sans-serif;color:#fff}
    center{position:fixed;inset:0;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
    #wrapper{width:554px;height:186px;padding:0;margin:0;background:#000;position:relative;transform-origin:center center}
    #logo{width:554px;height:186px;margin:0;position:relative;background:#000 url(src/pacman10-hp.gif) 0 0 no-repeat}
    #logo-l{width:200px;height:2px;left:177px;top:157px;background:#990;position:absolute;display:none;overflow:hidden}
    #logo-b{position:absolute;left:0;background:#ff0;height:8px;width:0}
    #pcm-c{box-sizing:content-box!important;touch-action:manipulation}
    form{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);margin:0;z-index:1000}
    .ds,.lsbb{display:block;border:0;background:transparent}
    .lsb{height:44px;padding:0 32px;border:1px solid #665500;border-radius:8px;background:#171717;color:#ffdf00;font:bold 16px Arial,sans-serif;cursor:pointer}
    .lsb:hover{background:#292929}
    .lsb:active{background:#444}
    .lsb:focus-visible{outline:2px solid #ffdf00;outline-offset:3px}
    #footer{display:none}
    #dlink{display:none}
    @media(max-height:420px){form{bottom:8px}.lsb{height:34px}}
  </style>
</head>
<body>
  <center>
  <div id="wrapper">
  	<a href="#gameover" id="dlink"></a>
  	<div id='logo' title="PAC-MAN's 30th Birthday! Doodle with PAC-MAN™ & ©1980 NAMCO BANDAI Games Inc.">
  		<div id="logo-l">
  			<div id="logo-b">
  			</div>
  		</div>
    </div>
  </div>
	<script>
	  google.dom = {};
    google.pacManSound = true;
    google.browser = {};
    google.browser.engine = {}

    google.dom.remove = function (a) {
    return a && a.parentNode && a.parentNode.removeChild(a)
    };

    google.dom.append = function (a) {
    return document.body.appendChild(a)
    };

    google.browser.engine.IE = false
    google.pml = function () {
      function d(a) {
        if (!google.pml_installed) {
          google.pml_installed = true;
          if (!a) {
            document.getElementById("logo").style.background = "black";
            window.setTimeout(function () {
              var b = document.getElementById("logo-l");
              if (b) b.style.display = "block"
            }, 400)
          }
          a = document.createElement("script");
          a.type = "text/javascript";
          a.src = "src/js/pacman10-hp.3.js";
          document.body.appendChild(a)
        }
      }
      function e() {
        if (document.f && document.f.btnI) document.f.btnI.onclick = function () {
            typeof google.pacman != "undefined" ? google.pacman.insertCoin() : d(false);
            return false
        }
      }
      if (!google.pml_loaded) {
        google.pml_loaded = true;
        window.setTimeout(function () {
          document.f && d(true)
        }, 1E4);
        e();
      }
    };
	</script>
	
  <form action="#submit" name='f'>
    <table width="23%" cellpadding='0' cellspacing='0'>
      <tr valign='top'>
        <td align='center' nowrap><br style="line-height:0">
          <span class='ds'>
            <span class='lsbb'>
              <input name='btnI' type='submit' value="Insert Coin" class='lsb'>
            </span>
          </span>
        </td>
      </tr>
    </table>
  </form>
  
  <div id="footer">
    <ul>
      <li><a href="http://github.com/macek/google_pacman">GitHub macek/google_pacman</a></li>
      <li><a href="http://google.com">&copy; 2010, Google</a></li>
      <li><a href="http://pacman.com">&copy; 1980, NAMCO BANDAI Games Inc.</a></li>
    </ul>
  </div>
  <script>
    google.pml && google.pml();
    (function(){
      var wrapper = document.getElementById("wrapper");
      function fit(){
        /* The original game logic uses a 554 x 186 playfield.
           Scale that actual playfield to the largest size that fits the viewport. */
        var availableHeight = Math.max(120, window.innerHeight - 104);
        var scale = Math.min((window.innerWidth - 24) / 554, availableHeight / 186);
        wrapper.style.transform = "scale(" + Math.max(0.35, scale) + ")";
      }
      window.addEventListener("resize", fit, {passive:true});
      fit();
    })();  </script>
  </center>
</html>
