<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070910"><title>Geometry Dash remix｜KNOTSPACE</title><style>
*{box-sizing:border-box}body{margin:0;background:#080d18;color:#eff8ff;font-family:system-ui,sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between}.top a,button,select{background:#13253a;color:#dffaff;border:1px solid #35536c;border-radius:9px;padding:10px 14px;text-decoration:none}.head{padding:22px 0}.tag{color:#71e7f3;font-size:11px;letter-spacing:.2em}h1{margin:7px 0}.sub{color:#9fb3c9;font-size:13px}.panel{background:#0c1524;border:1px solid #2a405b;border-radius:16px;padding:12px}.hud{display:flex;gap:12px;align-items:center;font-size:12px;padding:4px 2px 12px}.bar{height:7px;background:#23354b;flex:1;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#62e6f2}.stage{position:relative;aspect-ratio:16/9;min-height:220px}canvas{width:100%;height:100%;display:block;border-radius:10px;touch-action:manipulation}.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#07101bd9;border-radius:10px;padding:15px}.overlay[hidden]{display:none}.overlay p{font-size:13px;color:#b4c5d8;line-height:1.8}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.tools{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}.hint{font-size:11px;color:#8293a8;line-height:1.8}@media(max-width:600px){.wrap{padding:12px}.stage{aspect-ratio:4/3}}
</style><main class="wrap"><nav class="top"><a href="./">← ゲーム一覧</a><a href="./release-notes.html">更新履歴</a></nav><header class="head"><div class="tag">RHYTHM ACTION / BROWSER PORT</div><h1>Geometry Dash remix</h1><p class="sub">ジャンプのタイミングを合わせて、障害物だらけのコースを駆け抜けよう。</p></header><section class="panel"><div class="hud"><b id="lv">LEVEL 01</b><div class="bar"><i id="fill"></i></div><b id="pct">0%</b><span id="try">TRY 1</span></div><div class="stage"><canvas id="c" width="960" height="540"></canvas><div class="overlay" id="ov"><div><div class="tag">READY?</div><h2 id="title">READY TO DASH?</h2><p id="msg">タップ・クリック・Spaceでジャンプ。<br>トゲやブロックを避けてゴールへ！</p><div class="actions"><button id="play">PLAY</button><button id="select">LEVEL SELECT</button></div></div></div></div><div class="tools"><div><button id="retry">↻ RETRY</button><button id="sound">♪ SOUND ON</button></div><select id="level"><option value="0">Level 01 · Neon Run</option><option value="1">Level 02 · Pulse</option><option value="2">Level 03 · Overdrive</option></select></div></section><p class="hint">操作：タップ / クリック / Space / ↑キー。Scratch版の構成を参考に、コース・ジャンプ・衝突判定・演出をブラウザ向けに再実装した移植版です。</p></main><script>
(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),ov=document.querySelector('#ov'),fill=document.querySelector('#fill'),pct=document.querySelector('#pct'),lv=document.querySelector('#lv'),level=document.querySelector('#level');let mode='menu',n=0,tries=1,scroll=0,muted=false,ac,player,obs=[],parts=[],last=0,total=5400,speed=6;
const colors=[['#101f39','#28d7ed','#b4fbff'],['#28143d','#ee72ff','#ffe0ff'],['#142d29','#92ff91','#efffb1']];
function reset(){scroll=0;player={y:414,vy:0,ground:true,rot:0};parts=[];obs=[];let gap=[315,270,225][n],pos=560;while(pos<total+500){let type=Math.random()<(n===2?.45:.68)?'spike':Math.random()<.55?'block':'double';obs.push({x:pos,type});pos+=gap+Math.random()*95}}
function beep(f=580){if(muted)return;try{ac=ac||new AudioContext();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.08);o.stop(ac.currentTime+.08)}catch(e){}}
function show(t,m,b){document.querySelector('#title').textContent=t;document.querySelector('#msg').textContent=m;document.querySelector('#play').textContent=b;ov.hidden=false}
function start(){reset();mode='run';ov.hidden=true;document.querySelector('#try').textContent='TRY '+tries;last=performance.now()}
function jump(){if(mode==='run'&&player.ground){player.vy=-15.5;player.ground=false;beep()}}
function finish(crash){mode=crash?'dead':'win';if(crash){tries++;beep(130);show('CRASH!','惜しい！タイミングを変えて再挑戦。','RETRY')}else{beep(900);show('LEVEL COMPLETE!','コースクリア！次のレベルへ進もう。','NEXT LEVEL')}}
function draw(){let p=colors[n],g=x.createLinearGradient(0,0,0,540);g.addColorStop(0,p[0]);g.addColorStop(1,'#080d18');x.fillStyle=g;x.fillRect(0,0,960,540);x.strokeStyle='#ffffff10';for(let a=-(scroll*.35%80);a<960;a+=80){x.beginPath();x.moveTo(a,0);x.lineTo(a,440);x.stroke()}for(let a=0;a<960;a+=110){x.fillStyle='#dffaff38';x.fillRect((a-scroll*.2+1000)%1000,((a*7)%340),3,3)}x.fillStyle='#172b3e';x.fillRect(0,440,960,100);x.fillStyle=p[1];x.fillRect(0,438,960,5);for(let a=-(scroll%48);a<960;a+=48){x.fillStyle='#ffffff18';x.fillRect(a,460,24,4)}
obs.forEach(o=>{let a=o.x-scroll;if(a<-100||a>1000)return;x.fillStyle=p[1];x.shadowColor=p[1];x.shadowBlur=15;if(o.type==='block')x.fillRect(a,370,46,70);else{let k=o.type==='double'?2:1;for(let j=0;j<k;j++){x.beginPath();x.moveTo(a+j*46,440);x.lineTo(a+23+j*46,390);x.lineTo(a+46+j*46,440);x.fill()}}x.shadowBlur=0});
x.save();x.translate(145,player.y);x.rotate(player.rot);x.shadowColor=p[1];x.shadowBlur=18;x.fillStyle=p[2];x.fillRect(-24,-24,48,48);x.shadowBlur=0;x.fillStyle='#17243a';x.fillRect(-13,-10,8,8);x.fillRect(6,-10,8,8);x.restore();parts.forEach(q=>{x.globalAlpha=q.life;x.fillStyle=p[2];x.fillRect(q.x,q.y,5,5)});x.globalAlpha=1;x.fillStyle='#fff';x.font='bold 14px system-ui';x.fillText(['NEON RUN','PULSE','OVERDRIVE'][n],22,30)}
function frame(t){let dt=Math.min((t-last)/16.67||1,2);last=t;if(mode==='run'){scroll+=speed*dt;player.vy+=.78*dt;player.y+=player.vy*dt;if(player.y>=414){player.y=414;player.vy=0;player.ground=true;player.rot=Math.round(player.rot/(Math.PI/2))*Math.PI/2}else player.rot+=.11*dt;for(let o of obs){let a=o.x-scroll;if(a<190&&a+(o.type==='double'?92:46)>108&&player.y>(o.type==='block'?350:400)){finish(true);break}}parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.life-=.03});parts=parts.filter(q=>q.life>0);let v=Math.min(100,Math.floor(scroll/total*100));fill.style.width=v+'%';pct.textContent=v+'%';if(scroll>=total)finish(false)}draw();requestAnimationFrame(frame)}
function act(){if(mode==='run')jump();else if(mode==='dead')start();else if(mode==='win'){n=(n+1)%3;level.value=n;lv.textContent='LEVEL 0'+(n+1);start()}else start()}
c.addEventListener('pointerdown',e=>{e.preventDefault();act()});window.addEventListener('keydown',e=>{if(['Space','ArrowUp'].includes(e.code)){e.preventDefault();act()}});document.querySelector('#play').onclick=()=>{if(mode==='win'){n=(n+1)%3;level.value=n}start()};document.querySelector('#select').onclick=()=>{mode='menu';show('CHOOSE YOUR LEVEL','下のメニューからコースを選んでね。','PLAY')};document.querySelector('#retry').onclick=()=>{tries++;start()};level.onchange=()=>{n=+level.value;lv.textContent='LEVEL 0'+(n+1);tries=1;mode='menu';reset();show('READY TO DASH?','ジャンプして障害物を避けよう。','PLAY')};document.querySelector('#sound').onclick=e=>{muted=!muted;e.target.textContent=muted?'♪ SOUND OFF':'♪ SOUND ON'};reset();requestAnimationFrame(frame)})();
</script></html>
